services:
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: kis-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: kis-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      timescaledb:
        condition: service_healthy

  adminer:
    image: adminer:latest
    container_name: kis-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: timescaledb
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      timescaledb:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: kis-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  timescale_data:
